<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Peças</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96 border-t-4 border-red-600">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Acesso Restrito</h2>
            <p class="text-sm text-gray-500 mt-1">Informe suas credenciais</p>
        </div>
        <form id="login-form">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Usuário</label>
                <input type="text" id="username" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-red-500 focus:ring-red-500">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700">Senha</label>
                <input type="password" id="password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-red-500 focus:ring-red-500">
            </div>
            <button type="submit" class="w-full bg-red-600 text-white p-2 rounded-md hover:bg-red-700 font-medium transition shadow">Entrar</button>
            <p id="error-msg" class="text-red-500 text-sm mt-3 hidden text-center font-medium">Usuário ou senha incorretos.</p>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            if (response.ok) {
                window.location.href = '/';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
