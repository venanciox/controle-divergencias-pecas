<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Divergências</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Cabeçalho -->
        <header class="bg-white rounded-lg shadow p-6 flex justify-between items-center border-l-4 border-red-600">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Controle de Divergências</h1>
                <p class="text-sm text-gray-500">Gestão de sobras, faltas e defeitos de peças</p>
            </div>
            <button onclick="window.location.href='/api/exportar/excel'" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition font-medium shadow flex items-center gap-2">
                <i class="fa-solid fa-file-excel"></i> Exportar Excel
            </button>
        </header>

        <!-- Dashboard -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-gray-800 text-center">
                <p class="text-gray-500 text-sm font-semibold">Total de Registros</p>
                <p class="text-2xl font-bold text-gray-800" id="dash-total">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500 text-center">
                <p class="text-yellow-600 text-sm font-semibold">Faltas</p>
                <p class="text-2xl font-bold text-gray-800" id="dash-faltas">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500 text-center">
                <p class="text-blue-600 text-sm font-semibold">Sobras</p>
                <p class="text-2xl font-bold text-gray-800" id="dash-sobras">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-red-500 text-center">
                <p class="text-red-600 text-sm font-semibold">Defeitos</p>
                <p class="text-2xl font-bold text-gray-800" id="dash-defeitos">0</p>
            </div>
        </div>

        <!-- Formulário (Mesmo de antes) -->
        <section class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold mb-4 border-b pb-2" id="form-title">Registrar Nova Divergência</h2>
            <form id="divergencia-form" class="space-y-4">
                <input type="hidden" id="divergencia-id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">SKU (Part Number)</label>
                        <input type="text" id="sku" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 border p-2 uppercase">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Quantidade</label>
                        <input type="number" id="quantidade" required min="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Categoria</label>
                        <select id="categoria" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 border p-2">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Falta">Falta</option>
                            <option value="Sobra">Sobra</option>
                            <option value="Defeito">Defeito</option>
                        </select>
                    </div>
                    <div id="div-subcategoria" class="hidden">
                        <label class="block text-sm font-medium text-gray-700">Subcategoria</label>
                        <select id="subcategoria" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-red-500 border p-2">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Sobra">Sobra</option>
                            <option value="Contém no Estoque">Contém no Estoque</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t mt-4">
                    <button type="button" id="btn-cancelar" class="hidden px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition">Cancelar Edição</button>
                    <button type="submit" id="btn-salvar" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition font-medium shadow">Salvar Registro</button>
                </div>
            </form>
        </section>

        <!-- Filtros e Tabela -->
        <section class="bg-white rounded-lg shadow overflow-hidden">
            <div class="p-4 border-b bg-gray-50 flex gap-4 flex-wrap">
                <input type="text" id="filtro-sku" placeholder="Buscar por SKU..." class="rounded-md border-gray-300 border p-2 w-full md:w-1/3 uppercase">
                <select id="filtro-categoria" class="rounded-md border-gray-300 border p-2 w-full md:w-1/4">
                    <option value="">Todas as Categorias</option>
                    <option value="Falta">Apenas Faltas</option>
                    <option value="Sobra">Apenas Sobras</option>
                    <option value="Defeito">Apenas Defeitos</option>
                </select>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">SKU</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Qtd</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Categoria</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Subcategoria</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-body" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden text-center py-8 text-gray-500">Nenhum registro encontrado.</div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
